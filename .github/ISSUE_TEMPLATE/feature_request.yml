name: 功能建议
description: 说说你需要什么功能，以及为什么需要。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先看看 README，确认当前功能和接入范围。
        示例请使用合成数据，不要上传真实玩家数据、订单或凭据；附带日志和配置时请先脱敏。
  - type: input
    id: version
    attributes:
      label: 当前版本或提交号
      placeholder: 发布标签或提交 SHA
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前遇到什么限制，希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望这个功能怎样工作？如果会影响协议、配置或数据库，也请说明。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代办法
      description: 可以写写试过哪些办法，还有什么问题。
