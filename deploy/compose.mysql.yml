# 本地开发用。首次启动会执行建表脚本，已有数据卷不会自动更新表结构。
# 在本目录启动，或用 -f 指定此文件；两项密码都要通过环境变量设置。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gamehub
      MYSQL_USER: gamehub
      MYSQL_PASSWORD: ${GAMEHUB_HUBDB_PASSWORD:?请设置运行账号密码}
      MYSQL_ROOT_PASSWORD: ${GAMEHUB_MYSQL_ROOT_PASSWORD:?请设置本地root密码}
    ports:
      - "127.0.0.1:${GAMEHUB_MYSQL_PORT:-33306}:3306"
    volumes:
      - gamehub_mysql:/var/lib/mysql
      - ../migrations:/docker-entrypoint-initdb.d:ro
volumes:
  gamehub_mysql:
